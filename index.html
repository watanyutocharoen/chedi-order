function cartLines(){
  var out=[];
  Object.keys(S.cart).forEach(function(id){
    var q=S.cart[id];if(!(q>0))return;
    var it=S.items.find(function(i){return i.id===id});if(!it||isB(it))return;
    if(isP(it)){var pk=(S.pick[id]||[]).slice();out.push({item:it,shop:shopOf(it.shopId),qty:q,pick:pk,bad:!pk.length});return}
    out.push({item:it,shop:shopOf(it.shopId),qty:q});
  });
  Object.keys(S.mix).forEach(function(id){
    var it=S.items.find(function(i){return i.id===id});if(!it||!isB(it))return;
    var m=cleanMix(S.mix[id]),tot=mixSum(m);if(!tot)return;
    out.push({item:it,shop:shopOf(it.shopId),qty:tot/it.size,mix:m,tot:tot,bad:tot%it.size!==0});
  });
  Object.keys(S.xrows).forEach(function(id){
    var it=S.items.find(function(i){return i.id===id});if(!it||!isP(it))return;
    S.xrows[id].forEach(function(r){if(!(r.q>0))return;var pk=r.p.slice();out.push({item:it,shop:shopOf(it.shopId),qty:r.q,pick:pk,bad:!pk.length})});
  });
  Object.keys(S.crows).forEach(function(id){
    var it=S.items.find(function(i){return i.id===id});if(!it||!isCF(it))return;
    S.crows[id].forEach(function(r){if(!(r.q>0))return;out.push({item:it,shop:shopOf(it.shopId),qty:r.q,combo:true,bad:isF(it)&&fbad(it,r),cpt:ctext(it,r),cp:ccopy(it,r),price:cprice(it,r)})});
  });
  var seen={},res=[];
  out.forEach(function(l){if(l.combo){var k2=l.item.id+'|c|'+l.cpt;if(seen[k2]){seen[k2].qty+=l.qty;return}seen[k2]=l;res.push(l);return}if(l.pick&&!l.bad){var k=l.item.id+'|'+l.pick.slice().sort().join('+');if(seen[k]){seen[k].qty+=l.qty;return}seen[k]=l}res.push(l)});
  out=res;
  out.sort(function(a,b){return ((a.shop&&a.shop.ord)||0)-((b.shop&&b.shop.ord)||0)});
  return out;
}
function cartCountForShop(id){var n=0;itemsOf(id).forEach(function(i){n+=isCF(i)?cq(i.id):isB(i)?mixSum(S.mix[i.id]):((S.cart[i.id]>0?S.cart[i.id]:0)+(isP(i)?xq(i.id):0))});return n}

function parseOpt(x,sid){var sub=null,lim=null,bad=false;
  x=x.replace(/\{([^}]*)\}/,function(_,a){a=a.trim();if(a.charAt(0)==='@'){var k=a.slice(1).trim(),gr=(S.fgroups[sid]||[]).find(function(g){return g.name.indexOf(k)>=0});sub=gr?gr.options.map(function(o){return o.name}):[];if(!gr)bad=true}else sub=a.split(/[,，]/).map(function(z){return z.trim()}).filter(Boolean);return ''}).trim();
  x=x.replace(/\[([^\]]*)\]/,function(_,a){lim={};a.split(/[,，]/).forEach(function(p){var m=p.split('='),n=parseInt(m[1],10);if(m[0].trim()&&n>0)lim[m[0].trim()]=n});return ''}).trim();
  var m=x.match(FRE),o=m?{name:m[1].trim(),price:Number(m[2])}:{name:x,price:0};

function readPhoto(file){
  return new Promise(function(res,rej){
    var r=new FileReader();
    r.onload=function(){var im=new Image();im.onload=function(){
      var m=360,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=Math.max(1,Math.round(im.width*k));c.height=Math.max(1,Math.round(im.height*k));
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.72))};
      im.onerror=rej;im.src=r.result};
    r.onerror=rej;r.readAsDataURL(file);
  });
}

var W=1080,P=48,LH=38,COL={bg:'#F2F5F2',ink:'#1E2A2D',mut:'#5A6B6F',acc:'#C3372D',alt:'#FFFFFF'};
function wrapText(x,t,max){
  var out=[],line='';
  Array.from(String(t)).forEach(function(ch){var test=line+ch;if(x.measureText(test).width>max&&line){out.push(line);line=ch}else line=test});
  if(line)out.push(line);return out;
}
function layout(x,draw,title,subt,sections,grand){
  var L=P+20,R=W-P-20,y=P,leftMax=W-2*P-40-240;
  if(draw){x.fillStyle=COL.bg;x.fillRect(0,0,W,x.canvas.height)}
  x.textAlign='left';x.textBaseline='alphabetic';
  x.font='600 46px Prompt, Sarabun, sans-serif';if(draw){x.fillStyle=COL.ink;x.fillText(title,P,y+40)}y+=62;
  x.font='400 26px Sarabun, sans-serif';if(draw){x.fillStyle=COL.mut;x.fillText(subt,P,y+20)}y+=52;
  sections.forEach(function(s){
    if(draw){
      x.fillStyle=COL.acc;x.fillRect(P,y,W-2*P,56);x.fillStyle='#fff';
      x.font='600 30px Prompt, Sarabun, sans-serif';x.textAlign='left';x.fillText(s.head,L,y+38);
      x.font='400 26px Sarabun, sans-serif';x.textAlign='right';x.fillText(s.sub||'',R,y+37);x.textAlign='left';
    }
    y+=56;var i=0;
    s.rows.forEach(function(r){
      x.font='500 28px Sarabun, sans-serif';
      var lines=wrapText(x,r[0],leftMax).slice(0,4);if(!lines.length)lines=[''];
      var h=lines.length*LH+(r[1]?LH-6:0)+18;
      if(draw){
        x.fillStyle=i%2?COL.bg:COL.alt;x.fillRect(P,y,W-2*P,h);
        x.fillStyle=COL.ink;x.font='700 28px Sarabun, sans-serif';
        lines.forEach(function(ln,k){x.fillText(ln,L,y+10+LH*(k+1)-10)});
        if(r[1]){x.fillStyle=COL.mut;x.font='400 24px Sarabun, sans-serif';x.fillText(r[1],L,y+10+LH*lines.length+20)}
        x.fillStyle=COL.ink;x.font='700 30px Prompt, Sarabun, sans-serif';x.textAlign='right';x.fillText(r[2]||'',R,y+10+LH-8);x.textAlign='left';
      }
      y+=h;i++;
    });
    y+=28;
  });
  if(grand){
    if(draw){x.fillStyle=COL.ink;x.fillRect(P,y,W-2*P,68);x.fillStyle=COL.bg;x.font='600 30px Prompt, Sarabun, sans-serif';x.textAlign='left';x.fillText(grand[0],L,y+44);x.textAlign='right';x.fillText(grand[1],R,y+44);x.textAlign='left'}
    y+=68;
  }
  return y+P;
}
async function makeSheet(title,subt,sections,grand){
  try{await Promise.all([document.fonts.load('600 46px Prompt'),document.fonts.load('700 28px Sarabun'),document.fonts.load('400 24px Sarabun')])}catch(e){}
  var c=document.createElement('canvas');c.width=W;c.height=100;
  var h=layout(c.getContext('2d'),false,title,subt,sections,grand);
  c.height=h;
  layout(c.getContext('2d'),true,title,subt,sections,grand);
  return new Promise(function(res){c.toBlob(res,'image/png')});
}

      get:function(){return c.get()},onSnapshot:function(a,b){return c.onSnapshot(a,b)},
      add:async function(d){var tmp='tmp'+(++tmpN);loc_(n,tmp,d,'set');
        try{var ref=await c.add(d);var arr=S[(DEFS.find(function(x){return x[0]===n})||[])[1]]||[];var t=arr.find(function(x){return x.id===tmp});if(t){if(arr.some(function(x){return x.id===ref.id}))loc_(n,tmp,null,'del');else t.id=ref.id}return ref}
        catch(e){loc_(n,tmp,null,'del');throw e}}}},
    doc:function(path){var r=real.doc(path),pp=path.split('/');return {
      get:function(){return r.get()},
      update:async function(x){loc_(pp[0],pp[1],x,'merge');try{await r.update(x)}catch(e){refreshAll();throw e}},
      delete:async function(){loc_(pp[0],pp[1],null,'del');try{await r.delete()}catch(e){refreshAll();throw e}}}}
  };
}
function refreshAll(){
  if(!db||rfBusy)return Promise.resolve();rfBusy=true;
  return Promise.all(DEFS.map(function(d){return Promise.resolve().then(function(){return db.collection(d[0]).get()}).then(function(snap){return apply_(d[1],snap,d[2])}).catch(function(){return false})}))
    .then(function(r){rfBusy=false;if(r.some(Boolean))render()},function(){rfBusy=false});
}
function sub_(name,key,sorter){
  var t=setTimeout(function(){S.slow=true;render()},10000);
  db.collection(name).onSnapshot(function(snap){
    clearTimeout(t);
    apply_(key,snap,sorter);
    if(S.person&&key==='people'&&!S.people.some(function(p){return p.name===S.person})&&S.people.length&&S.loaded.people){/* keep typed name even if list changed */}
    render();
  },function(err){clearTimeout(t);S.loaded[key]=true;if(!S.errShown){S.errShown=true;toast('อ่านข้อมูลไม่ได้ ('+(err&&err.code||'error')+')')}render()});
}
function loadCache(){
  if(SEED&&SEED.shops.length){["people","shops","items"].forEach(function(k){S[k]=SEED[k].slice()});S.cached=true}
  try{var c=JSON.parse(localStorage.getItem('chedi-cache')||'null');
    if(c&&c.v===SEEDV&&Array.isArray(c.shops)&&c.shops.length){['people','shops','items','orders'].forEach(function(k){if(Array.isArray(c[k]))S[k]=c[k]});S.cached=true}}catch(e){}
}
function saveCache(){
  try{localStorage.setItem('chedi-cache',JSON.stringify({v:SEEDV,people:S.people,items:S.items,orders:S.orders,
    shops:S.shops.map(function(s){var o={};for(var k in s)if(k!=='photo')o[k]=s[k];return o})}))}catch(e){}
}
/* ---------- Google Apps Script backend (for use outside Claude) ---------- */
var API_URL='https://script.google.com/macros/s/AKfycbwCk_atsssgDI8vIt6yo2QMzAkLeYRjqLfWdiqPC5as_bvITEId7j5ZmBV5ZPkUdCvD2g/exec';
function isGas(){return !window.claude}
function gasRun(fn,args){
  if(!(window.google&&google.script&&google.script.run))return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args||[]})}).then(function(r){return r.json()}).then(function(j){if(!j||!j.ok)throw {message:(j&&j.m)||'error'};return j.v});
  return new Promise(function(res,rej){
  var r=google.script.run.withSuccessHandler(res).withFailureHandler(function(e){rej({message:(e&&e.message)||String(e)})});
  r[fn].apply(r,args||[]);
})}
function gasDb(){
  var inflight=null;
  function all(){if(!inflight)inflight=gasRun('getAll').then(function(d){inflight=null;return d},function(e){inflight=null;throw e});return inflight}
  function snapOf(arr){return {docs:arr.map(function(o){var c={};for(var k in o)if(k!=='id')c[k]=o[k];return {id:o.id,data:function(){return c}}})}}
  return {
    collection:function(n){return {
      get:function(){return all().then(function(d){return snapOf(d[n]||[])})},
      onSnapshot:function(next,err){all().then(function(d){next(snapOf(d[n]||[]))},function(e){if(err)err(e)});return function(){}},
      add:function(data){return gasRun('addDoc',[n,JSON.stringify(data)]).then(function(id){return {id:id}})}}},
    doc:function(path){var pp=path.split('/');return {
      get:function(){return Promise.reject({message:'unsupported'})},
      update:function(x){return gasRun('updateDoc',[pp[0],pp[1],JSON.stringify(x)])},
      delete:function(){return gasRun('deleteDoc',[pp[0],pp[1]])}}}
  };
}
var gasDl={save:function(o){return new Promise(function(res){
  var a=document.createElement('a'),u=URL.createObjectURL(o.data);a.href=u;a.download=o.filename;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(u);a.remove();res({status:'saved'})},400);
})}};
async function initGas(){
  try{
    var d=await gasRun('getAll');
    if(!(d.shops&&d.shops.length)&&!(d.people&&d.people.length))await gasRun('seedAll',[JSON.stringify(SEED)]);
    return wrapDb(gasDb());
  }catch(e){S.gasErr=(e&&e.message)||'error';return null}
}
async function start(){
  loadCache();fromHash();render();
  try{if(window.claude&&window.claude.use){db=await window.claude.use('db');if(db)db=wrapDb(db)}}catch(e){}
  if(!db&&isGas())db=await initGas();
  if(!db){S.hasDb=false;render();return}
  if(isGas())dl=gasDl;
  sub_('people','people',byOrd);sub_('shops','shops',byOrd);sub_('items','items',byTs);sub_('orders','orders',byTs);
  render();
  refreshAll();setInterval(function(){if(!document.hidden)refreshAll()},isGas()?12000:8000);
  document.addEventListener('visibilitychange',function(){if(!document.hidden)refreshAll()});
  try{window.claude.use('downloads').then(function(d){dl=d},function(){})}catch(e){}
  try{window.claude.use('user').then(function(u){
    if(u&&u.can)return Promise.resolve(u.can('data.write')).then(function(c){if(c===false){S.canWrite=false;render()}});
  }).catch(function(){})}catch(e){}
}
start();
})();
